name: Staff foundation
on:
  schedule:
    # Daily at 00:47 UTC (02:47 Zurich summer / 01:47 winter).
    - cron: '47 0 * * *'

permissions:
  contents: read
concurrency:
  group: staff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staff-browser:
    if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.repository == 'ramiz4/autokosova' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: autokosova
          POSTGRES_PASSWORD: autokosova
          POSTGRES_USER: autokosova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autokosova -d autokosova"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://autokosova:autokosova@127.0.0.1:5432/autokosova
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run build
      - run: npm run test:staff:browser
      - run: npx playwright install --with-deps chromium
      - name: Capture current synthetic staff workflows
        run: node --import tsx scripts/staff-workspace-ux-evidence.mts
        env:
          AUTOKOSOVA_E2E_DATABASE_URL: postgresql://autokosova:autokosova@127.0.0.1:5432/autokosova
      - name: Checkout the documented UX audit baseline
        uses: actions/checkout@v5
        with:
          ref: e5404b76d035902ed4661cbb705e73556ee1ba64
          path: .ux-baseline
      - run: npm ci --prefix .ux-baseline
      - run: npm run build --prefix .ux-baseline
      - name: Capture matching baseline workflows
        run: node --import tsx scripts/staff-workspace-ux-evidence.mts .ux-baseline test-results/staff-workspace-ux/before before
        env:
          AUTOKOSOVA_E2E_DATABASE_URL: postgresql://autokosova:autokosova@127.0.0.1:5432/autokosova
      - name: Upload synthetic staff viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staff-foundation-evidence
          path: |
            test-results/staff-foundation
            test-results/staff-workspace-ux
          if-no-files-found: ignore
          retention-days: 7
