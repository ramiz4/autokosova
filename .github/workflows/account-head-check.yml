name: Account branch verification

on:
  push:
    branches: [feat/69-account-profile]

permissions:
  contents: read

concurrency:
  group: account-head-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-head:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: autokosova
          POSTGRES_PASSWORD: autokosova
          POSTGRES_USER: autokosova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autokosova -d autokosova"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://autokosova:autokosova@127.0.0.1:5432/autokosova
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:server
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:dev
      - run: npm test
      - run: npm run build
      - run: npm run test:smoke
  browser-head:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run build
      - run: node scripts/account-browser-smoke.mjs
      - run: node scripts/footer-browser-smoke.mjs
      - name: Upload fictional browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-head-viewports
          path: |
            test-results/account
            test-results/footer
          if-no-files-found: ignore
          retention-days: 7
  development-head:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run test:dev:smoke:full
