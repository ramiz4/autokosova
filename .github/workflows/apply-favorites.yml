name: Apply reviewed favorites implementation
on:
  push:
    branches: [feat/72-favorites-page]
    paths: [.favorites-transfer/**, .github/workflows/apply-favorites.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/72-favorites-page
      - name: Apply exact reviewed source patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -d .favorites-transfer
          cat .favorites-transfer/*.b64 | base64 -d | xz -dc > /tmp/favorites-reviewed.patch
          echo 'd4c7185d405232f4aad8c341861ca98f8f0747efa20b9a1b5687741396887d5d  /tmp/favorites-reviewed.patch' | sha256sum --check
          git apply --check /tmp/favorites-reviewed.patch
          git apply --index /tmp/favorites-reviewed.patch
          git rm -r .favorites-transfer
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(favorites): private DB-backed overview with session-safe shared hearts'
          git push origin HEAD:refs/heads/feat/72-favorites-page
