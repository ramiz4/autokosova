name: OIDC source snapshot
on:
  push:
    branches: [fix/75-oidc-logout]
    paths: [.github/workflows/oidc-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: git archive HEAD -o /tmp/oidc-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: oidc-source
          path: /tmp/oidc-source.tar
          retention-days: 1
