name: Apply reviewed OIDC logout implementation
on:
  push:
    branches: [fix/75-oidc-logout]
    paths: [.github/workflows/apply-oidc-logout.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/75-oidc-logout
          fetch-depth: 2
      - name: Apply exact tested source patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "1a2fb741e7514e15b8f37e91500e88f87988a971"
          cat .oidc-transfer/*.b64 | base64 -d | xz -dc > /tmp/oidc-reviewed.patch
          echo 'fefc6721063fdba7ebd561f9e1a1596f8571c4d293b04b7d07c5caa57fb148ac  /tmp/oidc-reviewed.patch' | sha256sum --check
          git apply --check /tmp/oidc-reviewed.patch
          git apply /tmp/oidc-reviewed.patch
          git rm -r .oidc-transfer
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(auth): complete OIDC logout and require fresh explicit sign-in'
          git push origin HEAD:refs/heads/fix/75-oidc-logout
