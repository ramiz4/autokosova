name: Footer browser

on:
  schedule:
    # Daily at 00:37 UTC (02:37 Zurich summer / 01:37 winter).
    - cron: '37 0 * * *'

permissions:
  contents: read

concurrency:
  group: footer-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  footer-browser:
    if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.repository == 'ramiz4/autokosova' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run build
      - run: node scripts/footer-browser-smoke.mjs
      - name: Upload footer viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: footer-viewport-screenshots
          path: test-results/footer
          if-no-files-found: ignore
          retention-days: 7
