name: OIDC logout browser
on:
  schedule:
    # Daily at 00:42 UTC (02:42 Zurich summer / 01:42 winter).
    - cron: '42 0 * * *'

permissions:
  contents: read
concurrency:
  group: oidc-logout-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  oidc-logout-browser:
    if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.repository == 'ramiz4/autokosova' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run build
      - run: node scripts/oidc-logout-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oidc-logout-verification
          path: test-results/oidc-logout
          if-no-files-found: warn
          retention-days: 7
