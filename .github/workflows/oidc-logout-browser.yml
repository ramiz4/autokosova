name: OIDC logout browser
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  oidc-logout-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run build
      - run: node scripts/oidc-logout-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oidc-logout-verification
          path: test-results/oidc-logout
          if-no-files-found: warn
          retention-days: 7
