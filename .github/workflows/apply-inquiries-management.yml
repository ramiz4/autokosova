name: Apply reviewed inquiries management patch
on:
  push:
    branches: [feat/71-my-inquiries]
    paths: [.inquiries-transfer/**, .github/workflows/apply-inquiries-management.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/71-my-inquiries'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/71-my-inquiries
          fetch-depth: 2
      - name: Apply source only; workflows are updated through the authorized connector
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "2de6fce83ebf3bde9636069420a68fa8f29090fe"
          cat .inquiries-transfer/*.b64 | base64 -d | xz -dc > /tmp/inquiries-reviewed.patch
          echo '5dad32bf448ba4e0acdde1f682e2d0b7019dd19cb294a49f1f40b26b0f02daa3  /tmp/inquiries-reviewed.patch' | sha256sum --check
          git apply --check --unidiff-zero --exclude='.github/workflows/*' /tmp/inquiries-reviewed.patch
          git apply --unidiff-zero --exclude='.github/workflows/*' /tmp/inquiries-reviewed.patch
          git rm -r .inquiries-transfer
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(inquiries): database-backed editing, activity and confirmed deletion with redesigned UI'
          git push origin HEAD:refs/heads/feat/71-my-inquiries
