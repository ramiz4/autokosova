name: Account browser

on:
  schedule:
    # Daily at 00:22 UTC (02:22 Zurich summer / 01:22 winter).
    - cron: '22 0 * * *'

permissions:
  contents: read

concurrency:
  group: account-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  account-browser:
    if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.repository == 'ramiz4/autokosova' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run build
      - run: node scripts/account-browser-smoke.mjs
      - run: node scripts/profile-oidc-browser-smoke.mjs
      - name: Upload account viewport evidence (fictional fixtures only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-viewport-screenshots
          path: test-results/account
          if-no-files-found: ignore
          retention-days: 7
