name: Account browser

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: account-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  account-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run build
      - run: node scripts/account-browser-smoke.mjs
      - run: node scripts/profile-oidc-browser-smoke.mjs
      - name: Upload account viewport evidence (fictional fixtures only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-viewport-screenshots
          path: test-results/account
          if-no-files-found: ignore
          retention-days: 7

  demo-accounts-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: autokosova
          POSTGRES_PASSWORD: autokosova
          POSTGRES_USER: autokosova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autokosova -d autokosova"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://autokosova:autokosova@127.0.0.1:5432/autokosova
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - run: node scripts/demo-accounts-browser-smoke.mjs
      - name: Upload synthetic demo account evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-account-screenshots
          path: test-results/demo-accounts
          if-no-files-found: ignore
          retention-days: 7
