name: Inquiries browser

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inquiries-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run build
      - run: node scripts/inquiries-browser-smoke.mjs
      - run: node scripts/private-list-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inquiries-browser-fictional-fixtures
          path: |
            test-results/inquiries
            test-results/private-lists
          if-no-files-found: warn
          retention-days: 7
