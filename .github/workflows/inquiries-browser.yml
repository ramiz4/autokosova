name: Inquiries browser

on:
  schedule:
    # Daily at 00:32 UTC (02:32 Zurich summer / 01:32 winter).
    - cron: '32 0 * * *'

permissions:
  contents: read

concurrency:
  group: inquiries-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inquiries-browser:
    if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.repository == 'ramiz4/autokosova' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run build
      - run: node scripts/inquiries-browser-smoke.mjs
      - run: node scripts/private-list-browser-smoke.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dialogs:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inquiries-browser-fictional-fixtures
          path: |
            test-results/inquiries
            test-results/private-lists
          if-no-files-found: warn
          retention-days: 7
