name: Favorites browser

on:
  schedule:
    # Daily at 00:27 UTC (02:27 Zurich summer / 01:27 winter).
    - cron: '27 0 * * *'

permissions:
  contents: read

concurrency:
  group: favorites-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  favorites-db-browser:
    if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.repository == 'ramiz4/autokosova' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: autokosova
          POSTGRES_PASSWORD: autokosova
          POSTGRES_USER: autokosova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autokosova -d autokosova"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://autokosova:autokosova@127.0.0.1:5432/autokosova
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: AUTOKOSOVA_DEMO_DATA=1 npm run db:seed:demo
      - run: npm run build
      - run: node scripts/favorites-db-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: favorites-real-db-browser
          path: test-results/favorites-db
          if-no-files-found: warn
          retention-days: 7
