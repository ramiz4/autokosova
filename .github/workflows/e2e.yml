name: E2E acceptance

on:
  workflow_dispatch:
  schedule:
    # Daily at 00:17 UTC (02:17 Zurich summer / 01:17 winter).
    - cron: '17 0 * * *'

permissions:
  contents: read

concurrency:
  group: e2e-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e-acceptance:
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'ramiz4/autokosova' }}
    name: e2e-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: autokosova
          POSTGRES_PASSWORD: autokosova
          POSTGRES_USER: autokosova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autokosova -d autokosova"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AUTOKOSOVA_E2E_DATABASE_URL: postgresql://autokosova:autokosova@127.0.0.1:5432/autokosova
    steps:
      # Pin the main snapshot that triggered this nightly run, not a moving branch.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run typecheck:e2e
      - run: npm run test:e2e:policy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload sanitized synthetic application evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/e2e/acceptance.json
            test-results/e2e/browser/**/*.png
          if-no-files-found: error
          retention-days: 7
