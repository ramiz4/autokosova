name: Inquiries isolated workspace
on:
  push:
    branches: [feat/71-my-inquiries]
    paths: [.github/workflows/inquiries-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Package tracked source and approved dependencies only
        run: |
          mkdir -p /tmp/inquiries-workspace/toolchain
          git archive HEAD | tar -x -C /tmp/inquiries-workspace
          cp -a node_modules /tmp/inquiries-workspace/node_modules
          cp "$(command -v node)" /tmp/inquiries-workspace/toolchain/node
          cp -a "$(npm root -g)/npm" /tmp/inquiries-workspace/toolchain/npm
          tar -czf /tmp/inquiries-workspace.tgz -C /tmp/inquiries-workspace .
      - uses: actions/upload-artifact@v4
        with:
          name: inquiries-offline-workspace
          path: /tmp/inquiries-workspace.tgz
          retention-days: 1
          compression-level: 0
