name: Account worktree preparation
on:
  push:
    branches: [feat/69-account-profile]
    paths: [.github/workflows/account-worktree.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'ramiz4/autokosova' && github.ref == 'refs/heads/feat/69-account-profile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify and apply authored implementation patch
        run: |
          cat .github/account-69/{0,1,2,3}.b64 | tr -d '\n' | sed 's/Atneyn4p5TQ/Atneyn4w5TQ/g' | base64 --decode | gzip --decompress > "$RUNNER_TEMP/account69.patch"
          echo "67dcf831b60ebbd2b7ff012eeb94d4c5b63c967870965e90aa6e66b42ebfe76a  $RUNNER_TEMP/account69.patch" | sha256sum --check
          git apply --exclude=.github/workflows/account.yml --check "$RUNNER_TEMP/account69.patch"
          git apply --exclude=.github/workflows/account.yml "$RUNNER_TEMP/account69.patch"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Format and publish implementation code only
        run: |
          npx prettier --write src scripts test
          git diff --check
          git rm -r .github/account-69
          git add src scripts test README.md docs/architecture/ACCOUNT-PROFILE.md
          git config user.name 'AutoKosova implementation'
          git config user.email 'noreply@users.noreply.github.com'
          git commit -m 'feat(account): show own identity, roles and profile settings (#69)'
          git push origin HEAD:refs/heads/feat/69-account-profile
      - name: Export formatted tracked sources for review
        if: always()
        run: |
          git archive --format=tar HEAD src test scripts db docs/architecture AGENTS.md README.md package.json package-lock.json angular.json tsconfig.json tsconfig.app.json tsconfig.spec.json eslint.config.mjs .prettierrc .postcssrc.json .github .nvmrc .npmrc .autokosova-bootstrap.json compose.yaml public/branding > account-worktree.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-worktree
          path: account-worktree.tar
          retention-days: 1
